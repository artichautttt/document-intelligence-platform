[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Plateforme d'analyse intelligente de documents d'entreprise (RAG Multi-Agents)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "unstructured[docx]>=0.15",
    "pdfplumber>=0.11",
    "structlog>=24.1",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "qdrant-client>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501: line length is enforced by `ruff format`, not the linter (leaves prose/strings alone).
# B008: FastAPI's Depends()/File() in argument defaults is the intended idiom.
# UP042: keep explicit `(str, Enum)` mixin rather than switching to StrEnum.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
# 3.13 target: mypy needs >=3.12 semantics to parse recent dependency stubs (e.g. numpy).
python_version = "3.13"
strict = true
packages = ["document_intelligence"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]
