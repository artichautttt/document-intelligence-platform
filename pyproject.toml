[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Plateforme d'analyse intelligente de documents d'entreprise (RAG Multi-Agents)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "unstructured[docx]>=0.15",
    "pdfplumber>=0.11",
    "structlog>=24.1",
    "chromadb>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["document_intelligence"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]
