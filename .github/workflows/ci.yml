name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Test
        run: uv run pytest --cov=document_intelligence --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build ingestion image
        run: docker build -f docker/ingestion.Dockerfile -t document-intelligence-ingestion .

      - name: Build api image
        run: docker build -f docker/api.Dockerfile -t document-intelligence-api .
