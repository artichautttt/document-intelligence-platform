name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check --diff .

      - name: Type check
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Test
        run: uv run pytest --cov=document_intelligence --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ingestion.Dockerfile
          tags: document-intelligence-ingestion:ci
          push: false
          load: true
          cache-from: type=gha,scope=ingestion
          cache-to: type=gha,mode=max,scope=ingestion

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          tags: document-intelligence-api:ci
          push: false
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Validate docker-compose.yml
        run: docker compose config -q

      # Smoke test of the built API image, without any LLM key: health check,
      # PDF upload (ingestion + embeddings + ChromaDB), and /query must answer 503.
      - name: Smoke test api image
        run: |
          docker run -d --name api-smoke -p 8000:8000 document-intelligence-api:ci
          trap 'docker logs api-smoke | tail -20; docker rm -f api-smoke >/dev/null' EXIT
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api-smoke)" = healthy ] && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS -F "file=@tests/fixtures/documents/financial_report.pdf" http://localhost:8000/documents
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"query": "Quel est le chiffre d affaires ?", "k": 3}' http://localhost:8000/query)
          echo "POST /query without LLM key -> $code"
          test "$code" = 503
